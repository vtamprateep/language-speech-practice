name: CI - Backend Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11  # match your backend

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync

      - name: Check FastAPI startup
        run: |
          # Start the server in the background
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 --lifespan off & SERVER_PID=$!

          echo "Waiting for FastAPI to start..."

          # Try for up to 10 seconds
          for i in {1..10}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "FastAPI is up!"
              break
            fi
            sleep 1
          done

          # If the server is still not responding, fail the job
          if ! curl -sf http://127.0.0.1:8000/health > /dev/null; then
            echo "FastAPI failed to start"
            kill $SERVER_PID
            exit 1
          fi

          # Clean up
          kill $SERVER_PID
          echo "FastAPI startup check passed"
